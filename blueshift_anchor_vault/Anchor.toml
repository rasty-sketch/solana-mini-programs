[toolchain]
package_manager = "yarn"
anchor_version  = "0.32.1"

[features]
resolution = true
skip-lint  = false

[programs.localnet]
blueshift_anchor_vault = "vBWBj17Eu6xCK3FPxNYnvxch6sxe64TW9dVLDwcqD5S"

[provider]
cluster = "localnet"
wallet  = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[dev-dependencies]
litesvm            = "=0.6.1"
solana-keypair     = "2.2"
solana-signer      = "2.2"
solana-transaction = "2.2"
